name: 당근마켓 시세 자동 수집기 (Daily Crawler)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  scrape_and_save:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 💡 무거운 브라우저를 빼고 빠르고 가벼운 requests만 설치합니다!
          pip install requests pandas beautifulsoup4

      - name: Run Crawler & Save Result
        run: python backend-crawler/main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add frontend-web/public/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 자동 업데이트: 당근마켓 최신 시세 데이터 반영" && git push)
