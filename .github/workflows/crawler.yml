name: 당근마켓 시세 자동 수집기 (Daily Crawler)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  scrape_and_save:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 봇이 파일에 쓰기(업로드) 권한을 가질 수 있도록 추가합니다.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Crawler & Save Result
        run: python backend-crawler/main.py

      # 새로 수집된 데이터를 GitHub에 영구적으로 저장하는 마법의 명령어입니다!
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add frontend-web/public/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 자동 업데이트: 당근마켓 최신 시세 데이터 반영" && git push)
