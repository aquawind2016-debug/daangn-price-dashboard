name: 당근마켓 시세 자동 수집기 (Daily Crawler)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  scrape_and_save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Crawler & Save Result
        run: python backend-crawler/main.py
