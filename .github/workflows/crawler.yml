name: 당근마켓 시세 자동 수집기 (Daily Crawler)

on:
workflow_dispatch:
schedule:
- cron: '0 0 * * *'

🔑 봇에게 Git 푸시 권한을 명시적으로 부여합니다

permissions:
contents: write

jobs:
scrape_and_save:
runs-on: ubuntu-latest

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install playwright pandas beautifulsoup4
      playwright install --with-deps chromium

  - name: Run Crawler
    run: python backend-crawler/main.py

  - name: Commit and Push CSV
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add backend-crawler/daangn_result.csv
      git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 자동 업데이트: 당근마켓 데이터 적재" && git push)



4. 우측 상단 **`Commit changes...`** 버튼을 눌러 저장합니다.

이제 **`Actions`** 탭으로 가보시면 문법 에러 없이 노란색 불이 켜지며 봇이 정상적으로 달리기 시작할 것입니다! 실행되는 모습을 확인하고 알려주세요!
